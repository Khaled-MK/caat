<!-- @format -->

<!doctype html>
<html lang="fr">
   <head>
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
      <title>CAAT Sprint Quiz — ECSEL ALGER 2026</title>
      <link rel="stylesheet" href="css/styles.css" />
      <link rel="stylesheet" href="css/i18n.css" />
   </head>
   <body>
      <button id="language-switch" class="language-switch" type="button" aria-label="Passer en arabe">AR</button>
      <div id="trigger" class="trigger"></div>
      <main class="app-container">
         <!-- ==================== ÉCRAN 1 : ACCUEIL / STANDBY ==================== -->
         <section id="screen-welcome" class="screen active">
            <div class="welcome-content">
               <div class="brand-header">
                  <div class="logo-placeholder">
                     <img src="./imgs/CAAT blanc.png" alt="" />
                  </div>
                  <span class="tagline">Parés Pour Demain / مستعدون للغد</span>
               </div>

               <div class="hero-badge">Salon ECSEL ALGER 2026</div>
               <h1 class="main-title">CAAT Sprint Quiz</h1>
               <p class="subtitle">Spécial E-Commerce & Startups</p>

               <div class="quiz-info-cards">
                  <div class="info-card">
                     <span class="card-num">5</span>
                     <span class="card-txt">Questions</span>
                  </div>
                  <div class="info-card">
                     <span id="time-per-question-display" class="card-num">8s</span>
                     <span class="card-txt">Par question</span>
                  </div>
                  <div class="info-card">
                     <span class="card-num">🎁</span>
                     <span class="card-txt">Cadeau à gagner</span>
                  </div>
               </div>

               <a href="/quizPage">
                  <button id="btn-start" class="btn btn-primary btn-giant">DÉMARRER LE DÉFI</button>
               </a>
            </div>
         </section>
      </main>
      <script src="./js/i18n.js"></script>
      <script src="./js/main.js"></script>
   </body>
</html>
